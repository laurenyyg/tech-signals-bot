name: What Pipeline

on:
  schedule:
    - cron: "47 22 * * 0"  # Sundays 22:47 UTC (2:47 PM PST / 3:47 PM PDT); DeepSeek off-peak
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google service account key
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: printenv GOOGLE_SERVICE_ACCOUNT_JSON > information-source-digest-0a187c6dd85d.json

      - name: Run What pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WHAT_WEBHOOK_URL: ${{ secrets.WHAT_WEBHOOK_URL }}
          DATAIMPULSE_PROXY_URL: ${{ secrets.DATAIMPULSE_PROXY_URL }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
        run: python main.py --profile what

      - name: Commit and push seen ledger
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/what_seen.json
          git commit -m "chore: update what_seen.json after successful slack delivery [skip ci]" || echo "No changes to commit"
          git pull --rebase
          git push
